<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AURA</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/settings.css">
<link rel="stylesheet" href="/css/ota.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/memory.css">
<link rel="stylesheet" href="/css/reminders.css">
<link rel="stylesheet" href="/css/logs.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<canvas id="hud"></canvas>
<div id="app">
<nav class="top-nav">
<div class="nav-left">
<button class="menu-btn material-symbols-outlined" onclick="AURA.components.toggleSidebar()">menu</button>
<a href="#dashboard" class="logo"><span class="logo-dot"></span>AURA</a>
</div>
<div class="nav-center">
<span class="conn-dot" id="top-dot"></span>
<span id="top-conn">Connecting...</span>
</div>
<div class="nav-right">
<span class="ver" id="top-ver"></span>
<span class="tm" id="top-tm">--:--</span>
<button class="logout-btn material-symbols-outlined" id="logout-btn" onclick="AURA.auth.logout()" title="Sign out" aria-label="Sign out">logout</button>
</div>
</nav>
<div class="body-wrap">
<div class="overlay" id="overlay" onclick="AURA.components.toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
<nav>
<a href="#dashboard" data-page="dashboard"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
<a href="#chat" data-page="chat"><span class="material-symbols-outlined">chat</span>Chat</a>
<a href="#memory" data-page="memory"><span class="material-symbols-outlined">memory</span>Memory</a>
<a href="#reminders" data-page="reminders"><span class="material-symbols-outlined">notifications</span>Reminders</a>
<a href="#ota" data-page="ota"><span class="material-symbols-outlined">system_update</span>OTA Update</a>
<a href="#settings" data-page="settings"><span class="material-symbols-outlined">settings</span>Settings</a>
<a href="#logs" data-page="logs"><span class="material-symbols-outlined">article</span>Logs</a>
</nav>
</aside>
<main id="content"></main>
</div>
</div>
<div id="auth-root" aria-modal="true"></div>

<div class="modal-overlay" id="pwd-modal" aria-modal="true">
<div class="modal">
<div class="modal-h">Change Admin Password</div>
<div class="auth-sub" id="pwd-msg"></div>
<form id="pwd-form" onsubmit="AURA.auth.submitChangePassword(event)">
<div class="frm-grp"><label for="pwd-current">Current Password</label><input type="password" id="pwd-current" autocomplete="current-password" required></div>
<div class="frm-grp"><label for="pwd-new">New Password (min 8 characters)</label><input type="password" id="pwd-new" autocomplete="new-password" required></div>
<div class="frm-grp"><label for="pwd-confirm">Confirm New Password</label><input type="password" id="pwd-confirm" autocomplete="new-password" required></div>
<div class="auth-err" id="pwd-err"></div>
<div class="btn-group">
<button type="submit" class="btn btn-primary btn-sm">Update Password</button>
<button type="button" class="btn btn-ghost btn-sm" onclick="AURA.auth.closeChangePassword()">Cancel</button>
</div>
</form>
</div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/websocket.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/components.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/reminders.js"></script>
<script src="/js/logs.js"></script>
<script src="/js/ota.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
