name: aura_companion
description: "AURA Companion - the official companion app for the AURA Personal AI Assistant."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  web_socket_channel: ^3.0.2
  shared_preferences: ^2.3.5
  flutter_riverpod: ^2.6.1
  flutter_markdown: ^0.7.6
  intl: ^0.20.2
  google_fonts: ^6.2.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.2.0
  path_provider: ^2.1.6
  file_picker: 10.3.6
  timezone: ^0.11.1
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#05080F"
  adaptive_icon_foreground: assets/icon/app_icon.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
